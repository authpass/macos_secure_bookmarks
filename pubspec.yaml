name: macos_secure_bookmarks
description: Flutter desktop plugin for managing secure bookmarks to access files in sandbox.
version: 0.3.0
homepage: https://github.com/authpass/macos_secure_bookmarks
repository: https://github.com/authpass/macos_secure_bookmarks
issue_tracker: https://github.com/authpass/macos_secure_bookmarks/issues

topics:
  - macos
  - sandbox
  - secure-bookmarks

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: SecureBookmarksPlugin
